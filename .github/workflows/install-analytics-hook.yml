name: Install analytics hook

on:
  push:
    branches:
      - analytics/goatcounter

permissions:
  contents: write

jobs:
  patch-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: analytics/goatcounter

      - name: Add analytics loader to index
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('index.html')
          text = p.read_text(encoding='utf-8')
          hook = '  <script defer src="./analytics.js"></script>\n'
          if hook not in text:
              if '</head>' not in text:
                  raise SystemExit('index.html has no </head> tag')
              text = text.replace('</head>', hook + '</head>', 1)
              p.write_text(text, encoding='utf-8')
          PY

      - name: Remove one-shot installer workflow
        run: rm -f .github/workflows/install-analytics-hook.yml

      - name: Commit patched index
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html .github/workflows/install-analytics-hook.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Load analytics integration from site index'
          git push origin HEAD:analytics/goatcounter
